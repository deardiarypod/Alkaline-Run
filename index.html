<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Alkaline Run</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="game">

        <!-- START SCREEN -->
        <section id="start-screen" class="screen active">

            <div class="start-content">

                <h1>ALKALINE RUN</h1>

                <img
                    src="assets/images/bottle-empty.png"
                    alt="Blue alkaline water bottle"
                    id="start-bottle"
                >

                <button id="play-button">
                    TAP TO PLAY
                </button>

            </div>

        </section>


        <!-- GAME SCREEN -->
        <section id="game-screen" class="screen">

            <div id="progress">
                <span>ALKALINE LEVEL</span>
                <span id="level-count">0 / 10</span>
            </div>

            <div id="game-world">

                <img
                    src="assets/images/bottle-empty.png"
                    alt="Alkaline water bottle"
                    id="player"
                >

                <div id="obstacles"></div>

            </div>

        </section>


        <!-- WIN SCREEN -->
        <section id="win-screen" class="screen">

            <div id="confetti"></div>

            <div class="win-content">

                <img
                    src="assets/images/bottle-full.png"
                    alt="Full alkaline water bottle"
                    id="full-bottle"
                >

                <p class="win-label">9.5 • FULLY ALKALIZED</p>

                <h2>HAPPY BDAY!!</h2>

            </div>

        </section>

    </main>


    <script src="js/game.js"></script>

</body>
</html>
